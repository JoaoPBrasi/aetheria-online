name: aetheria-online
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetheria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheria_local}
      POSTGRES_DB: ${POSTGRES_DB:-aetheria}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
